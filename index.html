<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi - Senior Companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f8a70">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff8ef;--ink:#2b2b2b;--primary:#1f8a70;--primary-d:#156753;--soft:#e3f4ee;--accent:#ff9f43;--sos:#e5484d;--card:#fff;--line:#f0e4d3}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Noto Sans","Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif;font-size:20px;line-height:1.45;background:var(--bg);color:var(--ink);padding-bottom:110px}
body.big{font-size:25px}
header{background:linear-gradient(135deg,#1f8a70,#2fb08f);color:#fff;padding:14px 16px;border-radius:0 0 26px 26px;position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
header h1{margin:0;font-size:1.25em}
.tools{display:flex;gap:8px;align-items:center}
header select{width:auto;margin:0;padding:8px;border-radius:12px;border:0;font-size:.8em;background:#fff;color:var(--primary-d);font-weight:700}
header button{background:#fff;color:var(--primary-d);border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.85em}
.page{display:none;padding:16px}
.page.active{display:block}
h2{margin:8px 0 12px;font-size:1.3em}
h3{margin:4px 0 10px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 4px 16px rgba(120,90,40,.10);border:1px solid var(--line)}
button,input,select,textarea{font-size:1em;font-family:inherit}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:2px solid #d9cbb5;border-radius:14px;background:#fff}
label{font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;width:100%;min-height:60px;border:0;border-radius:18px;background:var(--primary);color:#fff;font-weight:700;margin:8px 0;padding:12px;box-shadow:0 3px 0 var(--primary-d)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.orange{background:var(--accent);color:#3a2300;box-shadow:0 3px 0 #d57d20}
.btn.red{background:var(--sos);box-shadow:0 3px 0 #b72a2f}
.btn.soft{background:var(--soft);color:var(--primary-d);box-shadow:0 3px 0 #bfe0d5}
.small{padding:8px 14px;border-radius:12px;border:0;background:var(--soft);color:var(--primary-d);font-weight:700;margin:6px 6px 0 0}
#sos{width:230px;height:230px;border-radius:50%;display:block;margin:14px auto;background:radial-gradient(circle at 35% 30%,#ff7b7f,#e5484d 60%,#b72a2f);color:#fff;border:8px solid #ffd9da;font-size:2.2em;font-weight:800;box-shadow:0 10px 30px rgba(229,72,77,.45);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}70%{box-shadow:0 0 0 26px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
@media (prefers-reduced-motion:reduce){#sos{animation:none}}
.hint{text-align:center;color:#6b5f50;margin:0 0 10px}
nav{position:fixed;bottom:10px;left:10px;right:10px;display:flex;background:#fff;border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:1000;overflow:hidden}
nav button{flex:1;border:0;background:#fff;padding:8px 2px;font-size:.68em;font-weight:700;color:#5a5044}
nav button span{display:block;font-size:1.9em;line-height:1.1}
nav button.on{background:var(--soft);color:var(--primary-d)}
#map{height:52vh;border-radius:22px;border:2px solid var(--line)}
#overlay{display:none;position:fixed;inset:0;background:rgba(30,20,10,.8);z-index:3000;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay .box{background:#fff;border-radius:26px;padding:22px;width:100%;max-width:480px;text-align:center}
#overlay h2{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
a.link{color:var(--primary-d);font-weight:700}
</style>
</head>
<body>

<header>
  <h1>🤝 Saathi</h1>
  <div class="tools">
    <select id="langSel" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="te">తెలుగు</option>
    </select>
    <button onclick="toggleBig()">A+</button>
  </div>
</header>

<!-- HOME -->
<section class="page active" id="p-home">
  <h2 id="hello"></h2>
  <button id="sos" onclick="startSOS()">🆘<br>SOS</button>
  <p class="hint" data-i="sosHint"></p>
  <button class="btn" data-i="imok" onclick="imOk()"></button>
  <p id="okStatus" class="hint"></p>

  <div class="card">
    <h3 data-i="contacts" data-icon="📞"></h3>
    <div id="contactList"></div>
    <button class="btn soft" data-i="addContact" onclick="addContact()"></button>
  </div>
  <div class="card">
    <h3 data-i="myDetails" data-icon="⚙️"></h3>
    <button class="btn soft" data-i="setName" onclick="setName()"></button>
    <button class="btn soft" data-i="allowNotif" onclick="askNotif()"></button>
  </div>
  <div class="card">
    <a class="link" target="_blank" href="<a class="link" target="_blank" href="https://github.com/Bhumika-glitch/senior-companion-app" data-i="about" data-icon="ℹ️"></a>"ℹ️"></a>
  </div>
</section>

<!-- REMINDERS -->
<section class="page" id="p-cal">
  <h2 data-i="reminders" data-icon="📅"></h2>
  <div class="card">
    <label data-i="whatFor"></label>
    <select id="rType">
      <option value="pension" data-i="pension" data-icon="💰"></option>
      <option value="checkup" data-i="checkup" data-icon="🩺"></option>
      <option value="medicine" data-i="medicine" data-icon="💊"></option>
      <option value="buymed" data-i="buymed" data-icon="🛒"></option>
      <option value="scheme" data-i="scheme" data-icon="📄"></option>
      <option value="special" data-i="special" data-icon="⭐"></option>
    </select>
    <label data-i="noteLbl"></label>
    <input id="rNote">
    <label data-i="dateTime"></label>
    <input type="datetime-local" id="rWhen">
    <label data-i="repeat"></label>
    <select id="rRep">
      <option value="none" data-i="once"></option>
      <option value="daily" data-i="daily"></option>
      <option value="weekly" data-i="weekly"></option>
      <option value="monthly" data-i="monthly"></option>
    </select>
    <button class="btn" data-i="saveRem" onclick="addRem()"></button>
  </div>
  <div id="remList"></div>
</section>

<!-- MAP -->
<section class="page" id="p-map">
  <h2 data-i="map" data-icon="🗺️"></h2>
  <div id="map"></div>
  <button class="btn" data-i="goHome" onclick="goHome()"></button>
  <div class="row">
    <button class="btn soft" data-i="setHome" onclick="setHome()"></button>
    <button class="btn soft" data-i="savePlace" onclick="savePlace()"></button>
  </div>
  <button class="btn orange" data-i="shareLoc" onclick="shareLoc()"></button>
  <div class="card"><h3 data-i="myPlaces" data-icon="📍"></h3><div id="placeList"></div></div>
</section>

<!-- VISITS -->
<section class="page" id="p-vis">
  <h2 data-i="visits" data-icon="🧑‍⚕️"></h2>
  <div class="card">
    <h3 data-i="volTitle"></h3>
    <p id="volInfo"></p>
    <button class="btn soft" data-i="setVol" onclick="setVol()"></button>
    <button class="btn" data-i="callVol" onclick="callVol()"></button>
  </div>
  <div class="card">
    <h3 data-i="addVisit"></h3>
    <input id="vBP" data-ph="bpPh">
    <select id="vMood">
      <option value="m1" data-i="m1"></option>
      <option value="m2" data-i="m2"></option>
      <option value="m3" data-i="m3"></option>
      <option value="m4" data-i="m4"></option>
      <option value="m5" data-i="m5"></option>
    </select>
    <textarea id="vNote" rows="3" data-ph="notesPh"></textarea>
    <button class="btn" data-i="saveVisit" onclick="addLog()"></button>
  </div>
  <div id="logList"></div>
</section>

<!-- TOGETHER -->
<section class="page" id="p-tog">
  <h2 data-i="together" data-icon="👥"></h2>
  <h3 data-i="dayCamps"></h3>
  <div id="eventList"></div>
  <h3 data-i="myFriends"></h3>
  <div id="friendList"></div>
  <button class="btn soft" data-i="addFriend" onclick="addFriend()"></button>
</section>

<nav>
  <button class="on" onclick="go('home',this)"><span>🏠</span><b data-i="home"></b></button>
  <button onclick="go('cal',this)"><span>📅</span><b data-i="reminders"></b></button>
  <button onclick="go('map',this)"><span>🗺️</span><b data-i="map"></b></button>
  <button onclick="go('vis',this)"><span>🧑‍⚕️</span><b data-i="visits"></b></button>
  <button onclick="go('tog',this)"><span>👥</span><b data-i="together"></b></button>
</nav>

<div id="overlay"><div class="box" id="obox"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* ---------- helpers & storage ---------- */
const $ = s => document.querySelector(s);
const KEY = 'saathi_v1';
let S = Object.assign({name:'',contacts:[],reminders:[],home:null,places:[],logs:[],
  vol:{name:'',phone:'',next:''},friends:[],joined:[],lastOk:'',trail:[],lang:'en',big:false},
  JSON.parse(localStorage.getItem(KEY) || '{}'));
if(!T[S.lang]) S.lang = 'en';
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const t = k => (T[S.lang] && T[S.lang][k]) || T.en[k] || k;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const toLocalISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const LOC = {en:'en-IN',hi:'hi-IN',te:'te-IN'};
const fmt = s => new Date(s).toLocaleString(LOC[S.lang],{dateStyle:'medium',timeStyle:'short'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const ICON = {pension:'💰',checkup:'🩺',medicine:'💊',buymed:'🛒',scheme:'📄',special:'⭐',e1t:'👥',e2t:'👥',e3t:'👥'};

/* ---------- language ---------- */
function applyLang(){
  document.querySelectorAll('[data-i]').forEach(e=>{
    e.textContent = (e.dataset.icon ? e.dataset.icon+' ' : '') + t(e.dataset.i);
  });
  document.querySelectorAll('[data-ph]').forEach(e=>{ e.placeholder = t(e.dataset.ph); });
  $('#langSel').value = S.lang;
  document.documentElement.lang = S.lang;
  greet(); renderContacts(); renderOk(); renderRem(); renderVol(); renderTog(); renderPlaces();
}
function setLang(l){ S.lang = l; save(); applyLang(); }
function greet(){
  const h = new Date().getHours();
  $('#hello').textContent = t(h<12?'gm':h<17?'ga':'ge') + (S.name ? ', ' + S.name : '') + ' 🙏';
}
function toggleBig(){ S.big = !S.big; save(); document.body.classList.toggle('big', S.big); }

/* ---------- navigation ---------- */
function go(p, btn){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  $('#p-'+p).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  if(p==='map') initMap();
  window.scrollTo(0,0);
}

/* ---------- sound, speech, popups ---------- */
function beep(n=4){
  try{
    const a = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){
      const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=.4;
      o.start(a.currentTime+i*.6); o.stop(a.currentTime+i*.6+.4);
    }
  }catch(e){}
}
function speak(txt){ try{ const u=new SpeechSynthesisUtterance(txt); u.lang=LOC[S.lang]; speechSynthesis.speak(u);}catch(e){} }
function popup(title, body, buttons){
  $('#obox').innerHTML = `<h2>${title}</h2><p>${body}</p>` +
    buttons.map((b,i)=>`<button class="btn ${b.cls||''}" id="pb${i}">${b.label}</button>`).join('');
  buttons.forEach((b,i)=>{ $('#pb'+i).onclick = () => { closePopup(); if(b.fn) b.fn(); }; });
  $('#overlay').style.display='flex';
}
function closePopup(){ $('#overlay').style.display='none'; }
function askNotif(){
  if('Notification' in window) Notification.requestPermission().then(r=>alert(t('notifState')+r));
  else alert(t('notSupported'));
}

/* ---------- HOME ---------- */
function setName(){ const n=prompt(t('askName'), S.name); if(n!==null){ S.name=n.trim(); save(); greet(); } }
function addContact(){
  const name=prompt(t('contactName')); if(!name) return;
  const phone=prompt(t('contactPhone')); if(!phone) return;
  S.contacts.push({id:uid(), name:name.trim(), phone:phone.trim()}); save(); renderContacts();
}
function delContact(id){ S.contacts=S.contacts.filter(c=>c.id!==id); save(); renderContacts(); }
function renderContacts(){
  $('#contactList').innerHTML = S.contacts.map(c=>
    `<div><b>${esc(c.name)}</b> ${esc(c.phone)}<br><button class="small" onclick="delContact('${c.id}')">${t('remove')}</button></div><hr>`
  ).join('') || `<p>${t('noContacts')}</p>`;
}
function imOk(){
  S.lastOk = new Date().toISOString(); save(); renderOk();
  speak(t('thanks'));
  if(S.contacts[0]){
    const msg = (S.name ? S.name+': ' : '') + t('okMsg') + ' - Saathi';
    if(confirm(t('tellOk')+' ('+S.contacts[0].name+')')) location.href='sms:'+S.contacts[0].phone+'?body='+encodeURIComponent(msg);
  }
}
function renderOk(){
  $('#okStatus').textContent = S.lastOk ? t('lastCheck')+new Date(S.lastOk).toLocaleString(LOC[S.lang]) : t('notChecked');
}

/* ---------- LOCATION ---------- */
let cur=null, map=null, meMarker=null, homeMarker=null, trailLine=null, placeLayer=null, firstFix=true;
function startWatch(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p=>{
    cur = {lat:p.coords.latitude, lon:p.coords.longitude};
    const last = S.trail[S.trail.length-1];
    if(!last || Date.now()-last.t > 60000){ S.trail.push({t:Date.now(),lat:cur.lat,lon:cur.lon}); if(S.trail.length>500) S.trail.shift(); save(); }
    updateMe();
  }, e=>console.log('GPS:',e.message), {enableHighAccuracy:true, maximumAge:10000});
}
function mapsLink(){ return cur ? `https://maps.google.com/?q=${cur.lat},${cur.lon}` : ''; }

/* ---------- SOS ---------- */
let sosTimer=null;
function startSOS(){
  if(!S.contacts.length){ alert(t('addContactFirst')); return; }
  let n=5;
  const show=()=>popup('🆘 '+t('sosSending')+' '+n, t('sosCancelHint'), [{label:t('cancel'),cls:'soft',fn:()=>clearInterval(sosTimer)}]);
  show(); beep(2);
  sosTimer=setInterval(()=>{ n--; if(n<=0){ clearInterval(sosTimer); sendSOS(); } else show(); },1000);
}
function sendSOS(){
  const msg = (S.name ? S.name+': ' : '') + t('sosMsg') + ' ' + (mapsLink()||t('noLoc'));
  beep(6); speak(t('sosMsg').split('!')[0]);
  const list = S.contacts.map(c=>
    `<div class="card"><b>${esc(c.name)}</b>
     <a class="btn red" href="tel:${esc(c.phone)}">${t('call')}</a>
     <a class="btn" href="sms:${esc(c.phone)}?body=${encodeURIComponent(msg)}">${t('sendSms')}</a></div>`).join('');
  $('#obox').innerHTML = `<h2>🆘 ${t('alertReady')}</h2><p>${t('tapSend')}</p>${list}<button class="btn soft" onclick="closePopup()">${t('close')}</button>`;
  $('#overlay').style.display='flex';
  setTimeout(()=>{ location.href='sms:'+S.contacts[0].phone+'?body='+encodeURIComponent(msg); }, 800);
}

/* ---------- REMINDERS ---------- */
function remTitle(r){ return r.key ? t(r.key)+(r.note?' - '+r.note:'') : r.title; }
function remIcon(r){ return r.icon || ICON[r.key] || '⭐'; }
function addRem(){
  const when = $('#rWhen').value;
  if(!when){ alert(t('pickDate')); return; }
  S.reminders.push({id:uid(), key:$('#rType').value, note:$('#rNote').value.trim(), when, rep:$('#rRep').value});
  save(); renderRem(); $('#rNote').value=''; alert(t('savedRem'));
}
function delRem(id){ S.reminders=S.reminders.filter(r=>r.id!==id); save(); renderRem(); }
function renderRem(){
  const l = S.reminders.slice().sort((a,b)=>a.when.localeCompare(b.when));
  $('#remList').innerHTML = l.map(r=>
    `<div class="card"><b>${remIcon(r)} ${esc(remTitle(r))}</b><br>${fmt(r.when)} ${r.rep!=='none'?'· '+t(r.rep):''}<br>
     <button class="small" onclick="delRem('${r.id}')">${t('delete')}</button></div>`
  ).join('') || `<p>${t('noRem')}</p>`;
}
function nextDate(s, rep){
  const d = new Date(s);
  if(rep==='daily') d.setDate(d.getDate()+1);
  if(rep==='weekly') d.setDate(d.getDate()+7);
  if(rep==='monthly') d.setMonth(d.getMonth()+1);
  return toLocalISO(d);
}
function checkReminders(){
  const now = new Date();
  S.reminders.slice().forEach(r=>{
    if(new Date(r.when) <= now){
      if(r.rep==='none') S.reminders = S.reminders.filter(x=>x.id!==r.id);
      else { let w=r.when; while(new Date(w)<=now) w=nextDate(w,r.rep); r.when=w; }
      save(); renderRem(); fireReminder(r);
    }
  });
}
function fireReminder(r){
  const title = remTitle(r), icon = remIcon(r);
  beep(5); speak(title);
  if('Notification' in window && Notification.permission==='granted') new Notification('Saathi', {body: icon+' '+title});
  popup(icon+' '+t('remTitle'), `<span style="font-size:1.3em">${esc(title)}</span>`, [
    {label:t('done')},
    {label:t('snooze'), cls:'soft', fn:()=>{
      S.reminders.push({id:uid(),key:r.key,note:r.note,title:r.title,icon:r.icon,when:toLocalISO(new Date(Date.now()+600000)),rep:'none'}); save(); renderRem(); }}
  ]);
}

/* ---------- MAP ---------- */
function initMap(){
  if(map){ setTimeout(()=>map.invalidateSize(),100); return; }
  const start = S.home ? [S.home.lat,S.home.lon] : cur ? [cur.lat,cur.lon] : [20.59,78.96];
  map = L.map('map').setView(start, (S.home||cur) ? 16 : 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  trailLine = L.polyline([], {color:'#1f8a70', weight:5}).addTo(map);
  drawHome(); drawPlaces(); updateMe(); renderPlaces();
}
function updateMe(){
  if(!map || !cur) return;
  if(!meMarker) meMarker = L.circleMarker([cur.lat,cur.lon],{radius:11,color:'#fff',weight:3,fillColor:'#e5484d',fillOpacity:1}).addTo(map).bindPopup(t('youHere'));
  else meMarker.setLatLng([cur.lat,cur.lon]);
  const today = new Date().toDateString();
  trailLine.setLatLngs(S.trail.filter(p=>new Date(p.t).toDateString()===today).map(p=>[p.lat,p.lon]));
  if(firstFix){ map.setView([cur.lat,cur.lon],16); firstFix=false; }
}
function drawHome(){
  if(!map || !S.home) return;
  if(homeMarker) map.removeLayer(homeMarker);
  homeMarker = L.marker([S.home.lat,S.home.lon],{icon:L.divIcon({html:'<div style="font-size:34px">🏠</div>',className:'',iconSize:[34,34]})}).addTo(map).bindPopup(t('myHome'));
}
function setHome(){
  if(!cur){ alert(t('waitLoc')); return; }
  S.home={lat:cur.lat,lon:cur.lon}; save(); drawHome(); alert(t('homeSaved'));
}
function goHome(){
  if(!S.home){ alert(t('setHomeFirst')); return; }
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${S.home.lat},${S.home.lon}&travelmode=walking`);
}
function savePlace(){
  if(!cur){ alert(t('waitLoc')); return; }
  const name=prompt(t('namePlace')); if(!name) return;
  S.places.push({id:uid(),name:name.trim(),lat:cur.lat,lon:cur.lon}); save(); drawPlaces(); renderPlaces();
}
function drawPlaces(){
  if(!map) return;
  if(placeLayer) map.removeLayer(placeLayer);
  placeLayer = L.layerGroup(S.places.map(p => L.marker([p.lat,p.lon]).bindPopup(esc(p.name)))).addTo(map);
}
function renderPlaces(){
  $('#placeList').innerHTML = S.places.map(p=>
    `<div><b>📍 ${esc(p.name)}</b><br>
     <button class="small" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking')">${t('goThere')}</button>
     <button class="small" onclick="delPlace('${p.id}')">${t('remove')}</button></div><hr>`
  ).join('') || `<p>${t('noPlaces')}</p>`;
}
function delPlace(id){ S.places=S.places.filter(p=>p.id!==id); save(); drawPlaces(); renderPlaces(); }
function shareLoc(){
  if(!cur){ alert(t('waitLoc')); return; }
  const text = `${S.name||''} - ${mapsLink()}`;
  if(navigator.share) navigator.share({text}).catch(()=>{});
  else window.open('https://wa.me/?text='+encodeURIComponent(text));
}

/* ---------- VOLUNTEER VISITS ---------- */
function setVol(){
  const n=prompt(t('volName'), S.vol.name); if(n===null) return;
  const p=prompt(t('volPhone'), S.vol.phone); if(p===null) return;
  const d=prompt(t('volNext'), S.vol.next); if(d===null) return;
  S.vol={name:n.trim(),phone:p.trim(),next:d.trim()}; save(); renderVol();
}
function callVol(){ if(S.vol.phone) location.href='tel:'+S.vol.phone; else alert(t('addVolFirst')); }
function renderVol(){
  $('#volInfo').innerHTML = S.vol.name
    ? `<b>${esc(S.vol.name)}</b> · ${esc(S.vol.phone)}<br>${t('nextVisit')}: <b>${esc(S.vol.next||t('notSet'))}</b>`
    : t('noVol');
  $('#logList').innerHTML = S.logs.slice().reverse().map(l=>
    `<div class="card"><b>${new Date(l.t).toLocaleDateString(LOC[S.lang],{dateStyle:'medium'})}</b> · ${esc(T.en[l.mood]?t(l.mood):l.mood)}<br>${t('bp')}: ${esc(l.bp||'-')}<br>${esc(l.note||'')}</div>`
  ).join('');
}
function addLog(){
  S.logs.push({t:Date.now(), bp:$('#vBP').value, mood:$('#vMood').value, note:$('#vNote').value});
  save(); $('#vBP').value=''; $('#vNote').value=''; renderVol(); alert(t('visitSaved'));
}

/* ---------- TOGETHER ---------- */
const EVENTS = ['e1','e2','e3'];
const EV_DAY = {e1:[0,10], e2:[3,10], e3:[5,17]};
function nextWeekday(day,h){ const d=new Date(); d.setHours(h,0,0,0); d.setDate(d.getDate()+((day+7-d.getDay())%7||7)); return toLocalISO(d); }
function joinEvent(id){
  if(S.joined.includes(id)) return;
  S.joined.push(id);
  const [day,h] = EV_DAY[id];
  S.reminders.push({id:uid(),key:id+'t',note:'',when:nextWeekday(day,h-1),rep:'weekly'});
  save(); renderTog(); renderRem(); alert(t('joinedMsg'));
}
function addFriend(){
  const n=prompt(t('friendName')); if(!n) return; const p=prompt(t('friendPhone')); if(!p) return;
  S.friends.push({id:uid(),name:n.trim(),phone:p.trim()}); save(); renderTog();
}
function delFriend(id){ S.friends=S.friends.filter(f=>f.id!==id); save(); renderTog(); }
function renderTog(){
  $('#eventList').innerHTML = EVENTS.map(e=>
    `<div class="card"><b>${t(e+'t')}</b><br>🕙 ${t(e+'w')}<br>📍 ${t(e+'p')}<br>${t(e+'a')}
     <button class="btn ${S.joined.includes(e)?'soft':''}" onclick="joinEvent('${e}')">${S.joined.includes(e)?t('joined'):t('join')}</button></div>`
  ).join('');
  $('#friendList').innerHTML = S.friends.map(f=>
    `<div class="card"><b>${esc(f.name)}</b>
     <a class="btn" href="tel:${esc(f.phone)}">${t('call')}</a>
     <a class="btn orange" href="https://wa.me/${esc(f.phone.replace(/\D/g,''))}">${t('whatsapp')}</a>
     <button class="small" onclick="delFriend('${f.id}')">${t('remove')}</button></div>`
  ).join('') || `<p>${t('noFriends')}</p>`;
}
